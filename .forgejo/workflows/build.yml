name: Build

enable-openid-connect: true


on:
  workflow_dispatch:
  push:
    branches:
      - master
    tags:
      - v*

jobs:
  test:
    runs-on: alpine
    steps:
      - uses: actions/toolkit/git-checkout@master
      - uses: actions/toolkit/go-setup@master
      - uses: actions/toolkit/go-test@master
  container:
    runs-on: alpine
    steps:
      - uses: actions/toolkit/git-checkout@master
      - uses: actions/toolkit/docker-login@master
        with:
          audience: u:1:3d49eeee-778f-42ed-bff2-ebc1fa5ba54d
          ghcr: ${{ secrets.GHCR_TOKEN }}
      - uses: actions/toolkit/docker-build@master
        with:
          ghcr: true
